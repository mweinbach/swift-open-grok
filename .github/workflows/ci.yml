name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One in-flight run per ref; a newer push supersedes an older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (build + test)
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CI: "1"
      OPENGROK_PERFORMANCE_PROFILE: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
      - name: Toolchain
        run: swift --version
      - name: Build
        run: zsh workflows/swift-safe-verify.zsh build
      - name: Product
        run: |
          GROK_COMMIT="$(git rev-parse --short HEAD)" \
            zsh workflows/swift-safe-verify.zsh build --product open-grok
      - name: Build tests
        run: zsh workflows/swift-safe-verify.zsh build-tests
      # --no-parallel is the documented green gate (PORT_STATUS.md). Default
      # parallel is also green locally, but shared-runner load variance makes
      # serial the honest CI configuration.
      - name: Test (serial gate)
        run: zsh workflows/swift-safe-verify.zsh test --no-parallel
      - name: Smoke (isolated home)
        run: |
          set -euo pipefail
          BIN=$(find .build/workflow-safe -name open-grok -type f -perm +111 | head -1)
          test -n "$BIN"
          smoke_root=$(mktemp -d)
          trap 'rm -rf "$smoke_root"' EXIT
          expected_version=$(sed -n '1p' OPEN_GROK_VERSION)
          expected_commit=$(git rev-parse --short HEAD)
          "$BIN" release-validate \
            --binary "$BIN" \
            --expected-version "$expected_version" \
            --expected-commit "$expected_commit" \
            --isolated-root "$smoke_root"

  linux:
    name: Linux (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Linux is a blocking platform gate. Unsupported runtime adapters must
    # report explicitly in the test output; they must not turn a failed build
    # into a successful workflow conclusion.
    container:
      image: swift:6.3.3-jammy
      # `--privileged` is what makes the sandbox gate real rather than
      # theatre. Under Docker's default seccomp/AppArmor profile
      # `unshare(CLONE_NEWUSER)` returns EPERM, so `bwrap` cannot create a
      # namespace and the verification step below failed on every push since
      # this job was added — taking the Linux build and the serial suite down
      # with it, so the platform produced no signal at all. Cost: this job
      # runs with full container capabilities, so it must keep building only
      # this repository's own sources on an ephemeral runner; do not add steps
      # here that execute third-party code. The alternative considered and
      # rejected was demoting the bwrap probe to non-fatal, which would have
      # kept the job green while quietly never exercising the sandbox.
      options: --privileged
    env:
      CI: "1"
    defaults:
      run:
        # The `bash` keyword runs steps as `bash --noprofile --norc -eo
        # pipefail`. pipefail is load-bearing: the `| tail -200` pipes below
        # only trim log volume, and without pipefail a failed `swift build`
        # exits 0 through `tail` — observed 2026-08-06 (run 31062760767):
        # the crash-handler C target failed with "2 errors generated" in all
        # three steps while every step concluded "success". Cost: if the
        # container image ever loses /bin/bash the job fails at the first
        # step instead of silently weakening back to `sh -e`; the
        # Ubuntu-based swift images ship bash, so that failure is loud and
        # immediate, which is the point of choosing it.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          apt-get update
          apt-get install -y bubblewrap zsh
          swift --version
      - name: Verify bubblewrap namespace
        run: |
          BWRAP=$(command -v bwrap)
          test -x "$BWRAP"
          "$BWRAP" --cap-drop ALL --ro-bind / / --dev-bind /dev /dev --proc /proc -- /bin/sh -c ':'
      - name: Build
        run: zsh workflows/swift-safe-verify.zsh build
      - name: Product
        run: zsh workflows/swift-safe-verify.zsh build --product open-grok
      - name: Build tests
        run: zsh workflows/swift-safe-verify.zsh build-tests
      - name: Test (serial gate)
        run: zsh workflows/swift-safe-verify.zsh test --no-parallel

  windows-compile:
    name: Windows (compile)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CI: "1"
      GROK_VERSION: 0.1.220-open-grok.windows-ci
      GROK_TEST_EXPECTED_COMPILED_VERSION: 0.1.220-open-grok.windows-ci
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          update: true
          install: zsh
      - name: Toolchain
        shell: msys2 {0}
        run: swift --version
      - name: Build
        shell: msys2 {0}
        run: zsh workflows/swift-safe-verify.zsh build
      - name: Build tests
        shell: msys2 {0}
        run: zsh workflows/swift-safe-verify.zsh build-tests

  windows-diagnostic-tests:
    name: Windows (diagnostic tests)
    needs: windows-compile
    runs-on: windows-latest
    timeout-minutes: 120
    continue-on-error: true
    env:
      CI: "1"
      GROK_VERSION: 0.1.220-open-grok.windows-ci
      GROK_TEST_EXPECTED_COMPILED_VERSION: 0.1.220-open-grok.windows-ci
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          update: true
          install: zsh
      - name: Toolchain
        shell: msys2 {0}
        run: swift --version
      - name: Test (diagnostic only)
        shell: msys2 {0}
        run: zsh workflows/swift-safe-verify.zsh test --no-parallel
