name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  macos:
    name: macOS build and test
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
      - name: Toolchain
        run: swift --version
      - name: Build
        run: zsh workflows/swift-safe-verify.zsh build
      - name: Build tests
        run: zsh workflows/swift-safe-verify.zsh build-tests
      # --no-parallel is the documented green gate (PORT_STATUS.md); default
      # parallel is also green locally but shared-runner load variance makes
      # serial the honest CI configuration.
      - name: Test (serial gate)
        run: zsh workflows/swift-safe-verify.zsh test --no-parallel
      - name: Product
        run: zsh workflows/swift-safe-verify.zsh build --product open-grok
      - name: Smoke
        run: |
          BIN=$(find .build/workflow-safe -name open-grok -type f -perm +111 | head -1)
          OPENGROK_HOME=$(mktemp -d) "$BIN" --version
          OPENGROK_HOME=$(mktemp -d) "$BIN" paths --json

  linux-surface:
    # Deliberately non-blocking: Linux is a declared support target the port
    # has not yet earned (PORT_STATUS "Known remaining gaps"). This job exists
    # to surface the current compile-gap list on every push, not to gate.
    name: Linux build (gap surfacing, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build (allowed to fail)
        run: swift build 2>&1 | tail -100
